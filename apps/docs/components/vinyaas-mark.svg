<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Vinyaas">
  <title>Vinyaas</title>
  <!-- Soft accent glow -->
  <defs>
    <radialGradient id="vinyaas-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A7B3FF" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#A7B3FF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#A7B3FF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="vinyaas-metal" x1="16" y1="8" x2="48" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E5E7EB" />
      <stop offset="100%" stop-color="#B8BEC8" />
    </linearGradient>
    <linearGradient id="vinyaas-metal-soft" x1="16" y1="56" x2="48" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F3F4F6" />
      <stop offset="55%" stop-color="#E5E7EB" />
      <stop offset="100%" stop-color="#9CA3AF" />
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="28" fill="url(#vinyaas-glow)" />
  <!-- Top chevron (inverted V) -->
  <path
    d="M14 30.5 L32 12.5 L50 30.5"
    stroke="url(#vinyaas-metal)"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Bottom chevron (V) -->
  <path
    d="M14 33.5 L32 51.5 L50 33.5"
    stroke="url(#vinyaas-metal-soft)"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
